{% extends 'admins/adminbase.html'%}

{% block contents %}

<style>

/* Ultra Dark Premium Background */

body{

    background:linear-gradient(135deg,#050101,#120202,#1a0303,#240505) !important;
    min-height:100vh;
    overflow-x:hidden;
}

/* Navbar */

.w3-top .w3-bar,
.navbar{

    background:linear-gradient(135deg,#140202,#2a0404,#3b0606) !important;
    box-shadow:0 6px 25px rgba(0,0,0,0.75);
    border-bottom:1px solid rgba(255,255,255,0.03);
}

/* Main Wrapper */

.admin-wrapper{

    min-height:88vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

/* Main Card */

.admin-card{

    width:100%;
    max-width:1400px;
    background:rgba(10,2,2,0.97);
    border-radius:38px;
    padding:55px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.85),
        0 0 25px rgba(120,0,0,0.15);

    border:1px solid rgba(255,255,255,0.03);

    animation:fadeIn 0.8s ease;
}

/* Heading */

.admin-title{

    text-align:center;
    margin-bottom:55px;
}

.admin-title h1{

    font-size:70px;
    font-weight:800;
    color:#ffffff;
    margin-bottom:18px;
    letter-spacing:3px;

    text-shadow:
        0 0 18px rgba(255,255,255,0.08),
        0 0 30px rgba(255,0,0,0.12);
}

.admin-title p{

    color:#fca5a5;
    font-size:22px;
    letter-spacing:1px;
    opacity:0.9;
}

/* Grid */

.info-grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:35px;
}

/* Card Link */

.card-link{

    text-decoration:none;
}

/* Cards */

.info-box{

    background:#1e293b;
    border-radius:28px;
    padding:45px 30px;
    text-align:center;

    transition:0.4s;

    border:1px solid rgba(255,255,255,0.04);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.03),
        0 10px 30px rgba(0,0,0,0.55);

    cursor:pointer;
}

/* Hover */

.info-box:hover{

    transform:translateY(-10px) scale(1.03);

    background:#334155;

    box-shadow:
        0 18px 40px rgba(0,0,0,0.55),
        0 0 20px rgba(37,99,235,0.22);
}

/* Icons */

.info-box h2{

    font-size:58px;
    margin-bottom:20px;
}

/* Titles */

.info-box h3{

    color:#38bdf8;
    margin-bottom:18px;
    font-size:34px;
    font-weight:700;
    line-height:50px;
}

/* Paragraph */

.info-box p{

    color:#e2e8f0;
    font-size:18px;
    line-height:34px;
}

/* Buttons */

.open-btn{

    display:inline-block;

    margin-top:28px;

    padding:12px 28px;

    background:linear-gradient(135deg,#2563eb,#06b6d4);

    color:white;

    border-radius:14px;

    font-size:17px;

    font-weight:700;

    transition:0.3s;
}

.open-btn:hover{

    transform:translateY(-2px);

    background:linear-gradient(135deg,#1d4ed8,#0891b2);
}

/* Animation */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>

<div class="admin-wrapper">

    <div class="admin-card">

        <!-- Heading -->

        <div class="admin-title">

            <h1>Admin Dashboard</h1>

            <p>
                Welcome to Crime Prediction AI Management System
            </p>

        </div>

        <!-- Cards -->

        

    </div>

</div>

{% endblock %}
