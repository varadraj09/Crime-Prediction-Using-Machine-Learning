{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>crimeprediction</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <style>
      body {font-family: "Times New Roman", Georgia, Serif;}
      h1, h2, h3, h4, h5, h6 {
        font-family: "Playfair Display";
        letter-spacing: 6px;
      }

      /* मोबाईल आणि एमुलेटरसाठी खास रिस्पॉन्सिव्ह CSS */
      @media (max-width: 600px) {
        .w3-bar {
          display: flex !important;
          flex-direction: column !important;
          align-items: center !important;
          padding: 10px 5px !important;
        }

        .w3-bar .w3-right {
          float: none !important;
          width: 100% !important;
          text-align: center !important;
          margin-top: 10px !important;
        }

        .w3-bar-item {
          display: inline-block !important;
          float: none !important;
          padding: 8px 12px !important;
          font-size: 14px !important;
        }

        /* 🔥 नवीन बदल: "Admin Dashboard" चा फॉन्ट स्क्रीनच्या आत बसवण्यासाठी */
        h1, .w3-xxlarge, [class*="Admin"], [id*="Dashboard"] h1 {
          font-size: 28px !important; /* फॉन्ट लहान केला */
          letter-spacing: 2px !important; /* अक्षरांमधील अंतर मोबाईलसाठी कमी केले */
          text-align: center !important;
          line-height: 1.2 !important;
          display: block !important;
          width: 100% !important;
          word-wrap: break-word !important; /* मोठा शब्द असेल तर तो खाली येईल */
        }
        
        /* डॅशबोर्डचे जे मुख्य ब्लॅक कार्ड किंवा कंटेनर आहे ते ओव्हरफ्लो होऊ नये म्हणून */
        .w3-content, .w3-row, div[class*="card"] {
          max-width: 100% !important;
          padding: 10px !important;
          box-sizing: border-box !important;
        }
      }
    </style>
</head>
<body>

<div class="w3-top">
  <div class="w3-bar w3-green w3-padding w3-card" style="letter-spacing:4px;">
    <a href="#home" class="w3-bar-item w3-button">crimeprediction</a>
    
    <div class="w3-right">
      <a href="{% url 'AdminHome' %}" class="w3-bar-item w3-button" style="display:none;"></a>
      <a href="{% url 'RegisterUsersView' %}" class="w3-bar-item w3-button">User Details</a>
      <a href="{% url 'index' %}" class="w3-bar-item w3-button">Logout</a>
    </div>
  </div>
</div>

<header class="w3-display-container w3-content w3-wide" style="max-width:5000px; min-width:100%; margin-top: 60px;" id="home">
  <div class="w3-display-bottomleft w3-padding-large w3-opacity">
    <h1 class="w3-xxlarge">Le Catering</h1>
  </div>
</header>

<div class="w3-content" style="max-width:2000px">
  <div class="w3-row w3-padding-64" id="about">
    <div class="w3-col m6 w3-padding-large w3-hide-small">
    </div>
  </div>
</div>

<div style="padding: 20px 10px;">
  {% block contents %}
  {% endblock %}
</div>

</body>
</html>
