{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Prediction Admin Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            height:100vh;
            background: linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:400px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        .title{
            text-align:center;
            margin-bottom:30px;
        }

        .title h2{
            font-weight:600;
            color:#2563eb;
        }

        .form-control{
            height:50px;
            border-radius:12px;
        }

        .btn-login{
            width:100%;
            height:50px;
            border:none;
            border-radius:12px;
            background:#2563eb;
            color:white;
            font-size:18px;
            transition:0.3s;
        }

        .btn-login:hover{
            background:#1d4ed8;
        }

        .crime-text{
            text-align:center;
            color:#64748b;
            margin-top:15px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="title">
        <h2>Admin Login</h2>
        <p>Crime Prediction System</p>
    </div>

    <form method="POST" action="{% url 'AdminLoginCheck' %}">
        {% csrf_token %}

        <div class="mb-3">
            <input type="text" name="loginid" class="form-control" placeholder="Enter Username" required>
        </div>

        <div class="mb-3">
            <input type="password" name="pswd" class="form-control" placeholder="Enter Password" required>
        </div>

        <button type="submit" class="btn-login">
            Login
        </button>
    </form>

    <div class="crime-text">
        AI Powered Crime Prediction
    </div>

</div>

</body>
<div style="position:absolute; top:20px; left:20px; z-index:1000;">

    <a href="/"
       style="
       text-decoration:none;
       padding:10px 20px;
       background:white;
       color:#2563eb;
       border-radius:10px;
       font-weight:600;
       box-shadow:0 4px 10px rgba(0,0,0,0.2);
       ">
       ⬅ Home
    </a>

</div>
</html>
