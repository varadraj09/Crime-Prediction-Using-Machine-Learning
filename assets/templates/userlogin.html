{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(

rgba(20,30,48,.75),
rgba(36,59,85,.75)

),

url("{% static 'C:\Users\VARADRAJ\Downloads\Crime-Prediction-Using-Machine-Learning\Crime Prediction Using Machine Learning\assets\static\download.jpg' %}");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

background-attachment:fixed;

overflow:hidden;

}

.glass{

width:420px;

padding:40px;

background:rgba(255,255,255,.1);

border-radius:20px;

backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,.2);

box-shadow:0 8px 32px rgba(0,0,0,.3);

color:white;

}

.glass h2{

text-align:center;

margin-bottom:10px;

font-size:35px;

font-weight:600;

}

.glass p{

text-align:center;

margin-bottom:30px;

color:#d1d5db;

}

.form-control{

height:52px;

border:none;

border-radius:12px;

margin-bottom:20px;

background:rgba(255,255,255,.2);

color:white;

padding-left:15px;

}

.form-control::placeholder{

color:#e5e7eb;

}

.form-control:focus{

background:rgba(255,255,255,.25);

color:white;

box-shadow:none;

}

.btn-login{

width:100%;

height:52px;

border:none;

border-radius:12px;

background:#06b6d4;

color:white;

font-size:18px;

font-weight:600;

transition:.3s;

}

.btn-login:hover{

background:#0891b2;

transform:translateY(-2px);

}

.bottom-text{

text-align:center;

margin-top:20px;

color:#d1d5db;

}

.bottom-text a{

color:#67e8f9;

text-decoration:none;

font-weight:500;

}

.home-btn{

text-decoration:none;

padding:12px 22px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(10px);

color:white;

border-radius:12px;

font-weight:600;

border:1px solid rgba(255,255,255,.2);

transition:.3s;

}

.home-btn:hover{

background:#06b6d4;

color:white;

transform:translateY(-2px);

}

</style>

</head>

<body>

<div style="position:absolute; top:20px; left:20px; z-index:1000;">

<a href="/"
style="margin-top: 40px; display: inline-block;"
class="home-btn">

⬅ Home

</a>

</div>


<div class="glass">

<h2>

User Login

</h2>

<p>

AI Powered Crime Prediction System

</p>

<form method="POST" action="{% url 'UserLoginCheck' %}">

{% csrf_token %}

<input
type="text"
name="loginid"
class="form-control"
placeholder="Enter Username"
required>

<input
type="password"
name="pswd"
class="form-control"
placeholder="Enter Password"
required>

<button
type="submit"
class="btn-login">

Login

</button>

</form>

<div class="bottom-text">

Don't have account?

<a href="/UserRegister/">

Register

</a>

</div>

</div>

</body>
</html>
