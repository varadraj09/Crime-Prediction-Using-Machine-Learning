{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Crime Prediction AI</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- W3CSS -->
    <link rel="stylesheet"
        href="https://www.w3schools.com/w3css/4/w3.css">

<style>

/* ===== GLOBAL ===== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    overflow-x:hidden;
    font-family:"Times New Roman", Georgia, Serif;
}

/* ===== BODY BACKGROUND ===== */

body{

    background-image:url('{% static "piccrime.jpg" %}');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;
}

/* ===== NAVBAR ===== */

.w3-top{

    position:fixed !important;

    top:0;
    left:0;

    width:100%;

    z-index:9999;
}

/* ===== NAVBAR CONTAINER ===== */

.w3-bar{

    display:flex !important;

    align-items:center !important;

    gap:10px;

    width:100%;

    padding:14px 16px !important;

    background:#000 !important;

    overflow-x:auto !important;
    overflow-y:hidden !important;

    white-space:nowrap !important;

    scrollbar-width:none;
}

.w3-bar::-webkit-scrollbar{
    display:none;
}

/* ===== NAVBAR ITEMS ===== */

.w3-bar-item,
.w3-button{

    flex-shrink:0 !important;

    border-radius:8px;

    text-decoration:none !important;
}

/* ===== LOGO ===== */

.logo-text{

    font-size:28px;

    font-weight:bold;

    color:white !important;

    letter-spacing:1px;

    padding:8px 12px;

    max-width:100%;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

/* ===== MAIN OVERLAY ===== */

.overlay{

    background:rgba(0,0,0,0.72);

    min-height:100vh;

    padding-top:95px;

    padding-left:15px;

    padding-right:15px;
}

/* ===== HERO ===== */

.hero{

    text-align:center;

    color:white;

    padding:40px 15px;
}

.hero h1{

    font-size:48px;

    font-weight:bold;

    margin-bottom:20px;
}

.hero p{

    font-size:18px;

    max-width:700px;

    margin:auto;

    margin-bottom:30px;

    line-height:1.6;
}

/* ===== BUTTONS ===== */

.btn-group-custom{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:15px;
}

.btn{

    padding:12px 28px;

    border-radius:12px;

    text-decoration:none;

    font-weight:600;

    transition:0.3s ease;

    border:none;
}

.admin{

    background:#2563eb;

    color:white;
}

.user{

    background:#06b6d4;

    color:white;
}

.register{

    background:#9333ea;

    color:white;
}

.btn:hover{

    opacity:0.9;

    transform:translateY(-2px);

    color:white;
}

/* ===== CARD FIX ===== */

.card{

    width:100% !important;

    border-radius:18px;
}

/* ===== MEDIA ===== */

img,
iframe,
canvas{

    max-width:100% !important;

    height:auto !important;
}

/* ===== MOBILE RESPONSIVE ===== */

@media screen and (max-width:768px){

    /* NAVBAR */

    .w3-bar{

        padding:10px 10px !important;

        gap:8px;
    }

    .logo-text{

        font-size:20px !important;

        padding:8px 10px !important;

        max-width:90%;
    }

    .w3-bar-item,
    .w3-button{

        font-size:14px !important;

        padding:8px 12px !important;
    }

    /* OVERLAY */

    .overlay{

        padding-top:80px !important;

        padding-left:10px;

        padding-right:10px;
    }

    /* HERO */

    .hero{

        padding:25px 10px;
    }

    .hero h1{

        font-size:30px;
    }

    .hero p{

        font-size:15px;

        line-height:1.5;
    }

    /* BUTTON GROUP */

    .btn-group-custom{

        flex-direction:column;

        align-items:center;
    }

    .btn{

        width:92%;

        padding:12px 18px;
    }

    /* BOOTSTRAP ROW FIX */

    .row{

        display:flex !important;

        flex-direction:column !important;

        gap:15px;

        margin:0 !important;
    }

    .col,
    .col-md-3,
    .col-md-4,
    .col-md-6,
    .col-md-12{

        width:100% !important;

        max-width:100% !important;

        flex:0 0 100% !important;

        padding:0 5px !important;
    }

    /* DASHBOARD TOP MENU FIX */

    .top-menu{

        display:flex;

        overflow-x:auto;

        overflow-y:hidden;

        gap:10px;

        padding-bottom:5px;

        white-space:nowrap;

        scrollbar-width:none;
    }

    .top-menu::-webkit-scrollbar{

        display:none;
    }

    .top-menu .menu-item{

        flex-shrink:0;

        min-width:90px;
    }
}

</style>
</head>
<style>

html,body{
    overflow-x:hidden !important;
    width:100% !important;
    max-width:100% !important;
}

.w3-top{
    width:100vw !important;
}

.w3-bar{
    width:100vw !important;
    overflow-x:auto !important;
}

</style>
<body>

<!-- ===== NAVBAR ===== -->

<div class="w3-top">

    <div class="w3-bar">

        <a href="/" class="w3-bar-item logo-text">
            Crime Prediction AI
        </a>

    </div>

</div>

<!-- ===== MAIN CONTENT ===== -->

<div class="overlay">

    <div class="hero">

        <h1>
            Crime Prediction Using AI
        </h1>

        <p>
            Advanced machine learning application for crime analysis,
            visualization and intelligent crime prediction using Artificial Intelligence.
        </p>

        <div class="btn-group-custom">

            <a href="{% url 'AdminLogin' %}"
                class="btn admin">

                Admin Login

            </a>

            <a href="{% url 'UserLogin' %}"
                class="btn user">

                User Login

            </a>

            <a href="{% url 'UserRegister' %}"
                class="btn register">

                Registration

            </a>

        </div>

    </div>

    {% block contents %}
    {% endblock %}

</div>

</body>
</html>
