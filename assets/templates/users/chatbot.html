{% extends 'users/userbase.html' %}
{% block contents %}
<div style="
display:flex;
justify-content:flex-end;
margin-bottom:15px;
">

<a href="/UserHome/"
class="back-custom">

⬅ Dashboard

</a>

</div>

<div class="container mt-5">

<div class="card p-5">

<h2>🤖 AI Crime Assistant</h2>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="area"
class="form-control"
placeholder="Enter Area"
required>

<br>

<input
type="text"
name="query"
class="form-control"
placeholder="Ask Question"
required>

<button
class="btn btn-primary mt-3">

Ask AI

</button>

</form>

{% if answer %}

<br>

<div class="alert alert-info">

{{answer}}

</div>

{% endif %}

</div>

</div>

{% endblock %}
