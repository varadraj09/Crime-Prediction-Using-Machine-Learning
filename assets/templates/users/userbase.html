{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Prediction System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
        }

        .navbar{
            background:#111827;
            padding:18px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 4px 20px rgba(0,0,0,0.3);
        }

        .logo{
            font-size:30px;
            font-weight:700;
            color:#38bdf8;
        }

        .nav-links{
            display:flex;
            gap:20px;
        }

        .nav-links a{
            text-decoration:none;
            color:white;
            background:#1e293b;
            padding:10px 18px;
            border-radius:10px;
            transition:0.3s;
            font-weight:500;
        }

        .nav-links a:hover{
            background:#2563eb;
        }

        .back-custom{

background:#1e293b;
color:white;

padding:10px 18px;

border-radius:10px;

text-decoration:none;

font-weight:500;

transition:0.3s;

display:inline-flex;
align-items:center;
gap:8px;

box-shadow:0 4px 10px rgba(0,0,0,0.25);

}

.back-custom:hover{

background:#2563eb;

color:white;

transform:translateY(-2px);

}

    </style>

</head>

<body>

<!-- Navbar -->

<div class="navbar">

    <div class="logo">
        Crime AI
    </div>

    <div class="nav-links">

    <a href="/dashboard/">
        🏠 Board
    </a>

    

    

    <a href="/map_view/">
        🗺 Live Map
    </a>

    <a href="/chatbot/">
        🤖 AI Assistant
    </a>

    <a href="/emergency/">
        🚨 Emergency
    </a>

    <a href="/UserLogin/">
        🚪 Logout
    </a>

</div>

</div>
    
<!-- Page Content -->

{% block contents %}

{% endblock %}

</body>
</html>
