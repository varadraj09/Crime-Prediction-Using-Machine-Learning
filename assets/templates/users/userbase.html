{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Crime Prediction System</title>



    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">



    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">



    <style>

        *{

            margin:0;

            padding:0;

            box-sizing:border-box;

            font-family:'Poppins',sans-serif;

        }



        body{

            background:#0f172a;

            color:white;

            width: 100%;

            overflow-x: hidden;

        }



        /* ===== NAVBAR ===== */

        .navbar{

            background:#111827;

            padding:18px 40px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            box-shadow:0 4px 20px rgba(0,0,0,0.3);

            width: 100%;

        }



        .logo{

            font-size:30px;

            font-weight:700;

            color:#38bdf8;

            white-space: nowrap;

        }



        .nav-links{

            display:flex;

            gap:15px;

            align-items: center;

        }



        .nav-links a{

            text-decoration:none;

            color:white;

            background:#1e293b;

            padding:10px 18px;

            border-radius:10px;

            transition:0.3s;

            font-weight:500;

            white-space: nowrap; /* नाव खाली तुटू नये म्हणून */

        }



        .nav-links a:hover{

            background:#2563eb;

        }



        .back-custom{

            background:#1e293b;

            color:white;

            padding:10px 18px;

            border-radius:10px;

            text-decoration:none;

            font-weight:500;

            transition:0.3s;

            display:inline-flex;

            align-items:center;

            gap:8px;

            box-shadow:0 4px 10px rgba(0,0,0,0.25);

        }



        .back-custom:hover{

            background:#2563eb;

            color:white;

            transform:translateY(-2px);

        }



        /* ===== 🔥 मोबाईलसाठी खास रिस्पॉन्सिव्ह नेव्हबार नियम ===== */

        @media screen and (max-width: 768px) {

            .navbar {

                flex-direction: column !important; /* लोगो वर आणि बटन्स खाली आणण्यासाठी */

                gap: 15px !important;

                padding: 15px 10px !important;

                text-align: center;

            }



            .logo {

                font-size: 24px !important;

                width: 100%;

                text-align: center;

            }



            /* या सेटिंगमुळे सर्व बटन्स मोबाईल स्क्रीनच्या बाहेर न जाता एका ओळीत सुटसुटीत स्क्रोल होतील */

            .nav-links {

                width: 100% !important;

                justify-content: flex-start !important;

                overflow-x: auto !important; /* मोबाईलवर डावीकडे-उजवीकडे स्क्रोल होईल */

                padding: 5px 10px !important;

                white-space: nowrap !important;

                scrollbar-width: none; /* स्क्रोल बार लपवण्यासाठी */

                -webkit-overflow-scrolling: touch;

            }



            /* क्रोमवर स्क्रोल बार दिसू नये म्हणून */

            .nav-links::-webkit-scrollbar {

                display: none;

            }



            .nav-links a {

                padding: 8px 14px !important;

                font-size: 14px !important;

            }

        }

    </style>

</head>

<body>



<div class="navbar">



    <div class="logo">

        Crime AI

    </div>



    <div class="nav-links">

        <a href="/dashboard/">🏠 Board</a>

        <a href="/map_view/">🗺 Live Map</a>

        <a href="/chatbot/">🤖 AI Assistant</a>

        <a href="/emergency/">🚨 Emergency</a>

        <a href="/UserLogin/" style="background: #ef4444;">🚪 Logout</a> </div>



</div>

    

{% block contents %}



{% endblock %}



</body>

</html>
